<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esta dirección no está en el mapa · Inmobiliaria A Ponte</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/logo/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --crema:#FAF8F4; --grafito:#2A2A28; --grafito-2:#56534E; --grafito-3:#8B857D; --naranja:#E8622C; --linea:#E4DED4; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100svh; background: var(--crema); color: var(--grafito);
    font-family: "Sora", system-ui, sans-serif; font-weight: 300;
    display: grid; place-items: center; padding: 2rem; text-align: center;
  }
  img { width: 200px; margin: 0 auto 2.4rem; display: block; }
  h1 { font-size: clamp(1.8rem, 5vw, 2.8rem); font-weight: 400; letter-spacing: -0.03em; margin: 0 0 0.8rem; }
  p { color: var(--grafito-2); max-width: 46ch; margin: 0 auto 2rem; line-height: 1.7; }
  a {
    display: inline-block; background: var(--naranja); color: #fff; text-decoration: none;
    padding: 0.95em 1.7em; border-radius: 3px; font-size: 0.86rem; font-weight: 500; letter-spacing: 0.04em;
  }
  .pies { margin-top: 2.6rem; font-size: 0.66rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--grafito-3); }
</style>
</head>
<body>
  <div>
    <img src="assets/img/logo/logo.svg" alt="Inmobiliaria A Ponte">
    <h1>Esta dirección no está en el mapa</h1>
    <p>La página que buscaba no existe o ha cambiado de sitio. Volvamos al principio de la ruta.</p>
    <a href="./">Ir a la portada</a>
    <p class="pies">Malpica · A Laracha · Carballo · Coristanco · Ponteceso · Zas · Santa Comba · Sanxenxo</p>
  </div>
</body>
</html>
